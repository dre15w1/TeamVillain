    <path d="M1140 232 C1050 300, 900 356, 780 366" fill="none" stroke="#3A2C13" stroke-opacity=".45" stroke-width="10"/>
    <!-- nose bridge -->
    <path d="M600 96 C592 150, 592 210, 600 268" fill="none" stroke="#3E3016" stroke-opacity=".55" stroke-width="8"/>
    <path d="M612 100 C620 152, 620 208, 612 262" fill="none" stroke="#FFF0C4" stroke-opacity=".35" stroke-width="4"/>
