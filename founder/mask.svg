<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"   stop-color="#FBF0CD"/>
      <stop offset="22%"  stop-color="#E3C583"/>
      <stop offset="52%"  stop-color="#B4924A"/>
      <stop offset="80%"  stop-color="#7C6130"/>
      <stop offset="100%" stop-color="#4A3A1B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#FFFAE8" stop-opacity=".70"/>
      <stop offset="30%"  stop-color="#FFFAE8" stop-opacity="0"/>
      <stop offset="62%"  stop-color="#FFF3CD" stop-opacity=".30"/>
