    <!-- brow ridges -->
    <path d="M232 190 C296 118, 442 110, 508 178" fill="none" stroke="#FFF6D6" stroke-opacity=".50" stroke-width="9"/>
    <path d="M968 190 C904 118, 758 110, 692 178" fill="none" stroke="#FFF6D6" stroke-opacity=".50" stroke-width="9"/>
