      C 86,116 258,36 420,26
      C 508,20 560,54 600,92
      C 640,54 692,20 780,26
      C 942,36 1114,116 1160,224
      C 1120,326 984,392 822,396
      C 722,398 650,352 600,298
      C 550,352 478,398 378,396
      C 216,392 80,326 40,224 Z
      M 252,206
      C 302,142 420,134 482,192
      C 432,262 300,272 252,206 Z
      M 948,206
      C 898,142 780,134 718,192
      C 768,262 900,272 948,206 Z"/>
    <clipPath id="clip"><use href="#body"/></clipPath>
